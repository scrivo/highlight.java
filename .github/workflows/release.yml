# Uploads a release of highlight.java to Maven Central when a tag v<version> is
# pushed. The upload is validated but not published: review it under Deployments
# at https://central.sonatype.com and press Publish (see highlight/RELEASING.md).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: highlight
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven
          # writes a "central" server to settings.xml that takes its credentials
          # from these environment variables
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD

      - name: Check that the tag matches the version in pom.xml
        run: |
          version=$(mvn -B -q org.apache.maven.plugins:maven-help-plugin:3.5.1:evaluate -Dexpression=project.version -DforceStdout)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $version in pom.xml"
            exit 1
          fi

      - name: Build, sign and upload
        # the bc signer signs in Java with the key and passphrase from the
        # environment, without gpg and its passphrase prompt
        run: mvn -B -Prelease -Dgpg.signer=bc clean deploy
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
